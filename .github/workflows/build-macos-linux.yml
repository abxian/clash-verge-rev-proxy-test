name: Build Desktop Clients

on:
  workflow_dispatch:
    inputs:
      build_macos_aarch64:
        description: 'Build macOS Apple Silicon'
        required: false
        type: boolean
        default: true
      build_macos_x64:
        description: 'Build macOS Intel'
        required: false
        type: boolean
        default: true
      build_linux_x64:
        description: 'Build Linux x64'
        required: false
        type: boolean
        default: true
      build_windows_x64:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      build_windows_arm64:
        description: 'Build Windows ARM64'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: '--max_old_space_size=4096'
  RUST_BACKTRACE: short

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            id: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
            enabled_input: build_macos_aarch64
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: app,dmg
            enabled_input: build_macos_x64
            artifact_glob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,rpm
            enabled_input: build_linux_x64
            artifact_glob: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            enabled_input: build_windows_x64
            artifact_glob: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Windows ARM64
            id: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            enabled_input: build_windows_arm64
            artifact_glob: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Stop when not selected
        if: github.event.inputs[matrix.enabled_input] != 'true'
        run: echo '${{ matrix.name }} skipped'

      - name: Checkout
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/checkout@v4

      - name: Install Rust
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: ${{ matrix.target }}

      - name: Cache Rust
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: desktop-${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.enabled_input] == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install macOS Intel OpenSSL
        if: matrix.target == 'x86_64-apple-darwin' && github.event.inputs[matrix.enabled_input] == 'true'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install macOS Apple Silicon OpenSSL
        if: matrix.target == 'aarch64-apple-darwin' && github.event.inputs[matrix.enabled_input] == 'true'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Install frontend dependencies
        if: github.event.inputs[matrix.enabled_input] == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecars and resources
        if: github.event.inputs[matrix.enabled_input] == 'true'
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build Tauri bundle
        if: github.event.inputs[matrix.enabled_input] == 'true'
        run: pnpm tauri build --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Verify macOS bundle
        if: matrix.os == 'macos-latest' && github.event.inputs[matrix.enabled_input] == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          echo "Bundle output:"
          find "$BUNDLE_DIR" -maxdepth 3 -print
          APP_PATH="$(find "$BUNDLE_DIR" -maxdepth 3 -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE_DIR" -maxdepth 3 -name '*.dmg' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::macOS .app bundle not found in $BUNDLE_DIR"
            exit 1
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "::error::macOS .dmg bundle not found in $BUNDLE_DIR"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil verify "$DMG_PATH"
          echo "Verified macOS app: $APP_PATH"
          echo "Verified macOS dmg: $DMG_PATH"

      - name: Upload bundle
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shenxianyun-${{ matrix.id }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
