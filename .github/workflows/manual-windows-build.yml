name: Manual Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: '--max_old_space_size=4096'
  RUST_BACKTRACE: short

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: manual-windows-x64

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecars and resources
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build Windows installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc -b nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: shenxianyun-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
